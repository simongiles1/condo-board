services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: condo
      POSTGRES_PASSWORD: condo
      POSTGRES_DB: condo_board
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condo -d condo_board"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT_BINDING:-127.0.0.1:5433:5432}"

  inngest:
    image: inngest/inngest:latest
    ports:
      - "14288:8288"
    volumes:
      - inngest_data:/var/lib/inngest
    environment:
      - INNGEST_DEV=1

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "14780:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      INNGEST_DEV: 1
    volumes:
      - uploads_data:/app/uploads
      - note_screenshots_data:/app/data/note-screenshots
      - email_attachments_data:/app/data/email-attachments
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  note_screenshots_data:
  email_attachments_data:
  inngest_data:
