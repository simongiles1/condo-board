services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: condo
      POSTGRES_PASSWORD: condo
      POSTGRES_DB: condo_board
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condo -d condo_board"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT_BINDING:-127.0.0.1:5433:5432}"

  inngest:
    image: inngest/inngest:latest
    command: ["inngest", "start", "--sqlite-dir", "/var/lib/inngest"]
    restart: unless-stopped
    ports:
      - "14288:8288"
    volumes:
      - inngest_data:/var/lib/inngest
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    ports:
      - "14780:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      INNGEST_DEV: 0
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
    volumes:
      - uploads_data:/app/uploads
      - note_screenshots_data:/app/data/note-screenshots
      - email_attachments_data:/app/data/email-attachments
    depends_on:
      db:
        condition: service_healthy
      inngest:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  note_screenshots_data:
  email_attachments_data:
  inngest_data:
